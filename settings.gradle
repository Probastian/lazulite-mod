pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle auto-download a matching JDK for each subproject's
	// java.toolchain block, instead of depending on JAVA_HOME/PATH.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'lazuli'

include 'api'
include 'common'
include 'services'
include 'features:hello-world-main-menu'
include 'features:steam-cloud-sync'
include 'features:friends-sidebar'
include 'features:steam-world-hosting'
include 'platform:fabric-26.2'
include 'platform:fabric-26.1'
include 'platform:fabric-1.21.11'

