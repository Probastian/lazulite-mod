allprojects {
	group = property('maven_group')
	version = property('mod_version')
}

subprojects {
	apply plugin: 'java-library'

	repositories {
		mavenCentral()
	}

	// Shared modules (api/common/services/libraries) target the lowest Java version
	// among all supported Minecraft versions, so every platform module can depend on
	// them. Platform modules override this to the Java version their Minecraft
	// version actually requires.
	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21

		// Pins the JDK used to compile this module, regardless of the JAVA_HOME/PATH
		// on the machine running the build. Gradle downloads a matching JDK if needed
		// (see the foojay-resolver-convention plugin in settings.gradle).
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	test {
		useJUnitPlatform()
	}

	// Lombok, available to every subproject with no per-module setup.
	dependencies {
		compileOnly "org.projectlombok:lombok:${lombok_version}"
		annotationProcessor "org.projectlombok:lombok:${lombok_version}"
		testCompileOnly "org.projectlombok:lombok:${lombok_version}"
		testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
	}

	// JSpecify nullness annotations (@Nullable/@NonNull), available to every subproject.
	dependencies {
		compileOnly "org.jspecify:jspecify:${jspecify_version}"
	}

	// JUnit 5, available to every subproject as `testImplementation`/`testRuntimeOnly`
	// with no per-module setup. Harmless no-op for modules with no tests.
	dependencies {
		testImplementation platform("org.junit:junit-bom:${junit_version}")
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

		// AssertJ fluent assertions and Mockito, layered on top of JUnit 5 for every subproject.
		testImplementation "org.assertj:assertj-core:${assertj_version}"
		testImplementation "org.mockito:mockito-core:${mockito_version}"
		testImplementation "org.mockito:mockito-junit-jupiter:${mockito_version}"
	}
}
