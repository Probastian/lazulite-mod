# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# Kept off: Loom's jar-in-jar packaging (processIncludeJars, used for the bundled
# steamworks4j dependency) shares an NIO zip filesystem across subproject tasks.
# Parallel project execution races on it and intermittently fails with
# java.nio.file.ClosedFileSystemException. See FabricMC/fabric-loom issues for
# processIncludeJars + parallel builds.
org.gradle.parallel=false

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=de.lazuli

# Dependencies
fabric_api_version=0.154.2+26.2

# Cardinal Components API (data attachment/sync/persistence for Fabric mods).
# https://maven.ladysnake.org/releases, MIT license. Version 8.0.1 targets
# both 26.2 and 26.1 (see platform/fabric-1.21.11/gradle.properties for its
# override, since 1.21.11 needs an older release line).
cardinal_components_version=8.0.1

# Lombok (shared across all subprojects, see root build.gradle)
lombok_version=1.18.46

# JSpecify nullness annotations (shared across all subprojects, see root build.gradle)
jspecify_version=1.0.0

# Testing (shared across all subprojects, see root build.gradle)
junit_version=5.14.4
assertj_version=3.27.7
mockito_version=5.22.0

# steamworks4j (Java bindings for the Steamworks SDK, used by services/steamworks).
# MIT license. Confirmed on Maven Central (Sonatype Central artifact page,
# https://central.sonatype.com/artifact/com.code-disaster.steamworks4j/steamworks4j/1.10.0).
steamworks4j_version=1.10.0


