plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
}

dependencies {
	// `include` (Loom's Jar-in-Jar) is required in addition to `implementation`
	// for every in-repo subproject below: `implementation project(...)` alone
	// only puts these classes on the compile/runtime classpath, which is enough
	// for local runClient/IDE launches (each subproject's own build/classes is
	// on the classpath directly) but does NOT bundle them into the shipped
	// remapped jar. Without `include`, the release jar built by CI is missing
	// all of :api/:common/:features:*/:services and crashes at launch with
	// ClassNotFoundException for those classes.
	api project(':api')
	include project(':api')
	implementation project(':common')
	include project(':common')
	implementation project(':features:main-menu')
	include project(':features:main-menu')
	implementation project(':features:tweaks')
	include project(':features:tweaks')
	implementation project(':features:steam-cloud-sync')
	include project(':features:steam-cloud-sync')
	implementation project(':features:friends-sidebar')
	include project(':features:friends-sidebar')
	implementation project(':features:rich-presence')
	include project(':features:rich-presence')
	implementation project(':features:steam-world-hosting')
	include project(':features:steam-world-hosting')
	implementation project(':features:server-join-presence')
	include project(':features:server-join-presence')
	implementation project(':features:cross-world-stats')
	include project(':features:cross-world-stats')
	implementation project(':features:server-browser')
	include project(':features:server-browser')
	implementation project(':services')
	include project(':services')

	// To change the versions see this project's gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// fabric-key-binding-api-v1 (Tweaks feature, spec F3): the umbrella
	// fabric-api artifact resolved above turned out NOT to place this
	// submodule's classes on the compile classpath by itself (confirmed via
	// a real compile failure on fabric-26.2, not assumed). Pinned directly
	// (matches this artifact's version as declared in this module's own
	// fabric-api POM) rather than via fabricApi.module(...), for consistency
	// with fabric-26.1/fabric-26.2's equivalent dependency (see those
	// modules' build.gradle for the fabric-key-mapping-api-v1 rename this
	// version predates -- .claude/context/minecraft.md's Known Cross-Version
	// API Differences table, "Hotkey registration Fabric API submodule" row).
	modImplementation "net.fabricmc.fabric-api:fabric-key-binding-api-v1:1.1.7+4fc5413f3e"

	// Cardinal Components API: data attachment/sync/persistence for Fabric mods.
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"

	// Jar-in-Jar: physically bundles steamworks4j (JNI bridge + Valve's
	// redistributable binary alike) inside this module's shipped mod jar.
	include "com.github.Probastian.steamworks4j:steamworks4j:${steamworks4j_version}"
}

// Writes a dev-only run/steam_appid.txt before runClient, defaulting to
// Valve's public test App ID 480 ("Spacewar"), overridable via
// -PsteamAppId=<id>. This is a Gradle-build-time concern, deliberately
// separate from SteamAppIdResolver's runtime JVM-system-property override
// (see services/steamworks/SteamAppIdResolver's JavaDoc).
tasks.register('generateSteamAppId') {
	def outputFile = layout.projectDirectory.file('run/steam_appid.txt')
	def appId = project.findProperty('steamAppId') ?: '480'
	inputs.property('appId', appId)
	outputs.file(outputFile)

	doLast {
		outputFile.asFile.parentFile.mkdirs()
		outputFile.asFile.text = "${appId}\n"
	}
}

tasks.named('runClient') {
	dependsOn tasks.named('generateSteamAppId')
}

// VS Code's Java launch configs invoke Loom's 'configureClientLaunch' as their
// preLaunchTask (they run the built classpath directly rather than going
// through 'runClient'), so steam_appid.txt must be generated here too or a
// fresh clone launched from VS Code silently skips Steam initialization.
// Loom registers 'configureClientLaunch' inside its own afterEvaluate block,
// so ours must run in afterEvaluate too (tasks.named(...) at config time
// fails since the task doesn't exist yet).
afterEvaluate {
	tasks.named('configureClientLaunch') {
		dependsOn tasks.named('generateSteamAppId')
	}
}

// features/main-menu ships real texture assets (assets/lazuli/textures/achievements/*.png)
// but is a plain Java library module with no fabric.mod.json of its own, so Fabric
// Loader's resource-pack discovery never merges its assets/ folder into the lazuli
// mod's resource pack (Loader only scans mod containers that declare fabric.mod.json).
// Pulling its resources directory into this platform's own sourceSet makes those PNGs
// land inside this module's actual fabric.mod.json-bearing jar instead.
sourceSets.main.resources.srcDir project(':features:main-menu').file('src/main/resources')

processResources {
	// Explicit dependency since the added resources srcDir above is owned by another
	// Gradle project; without this Gradle may warn/fail about an implicit cross-project
	// task dependency depending on execution order.
	dependsOn project(':features:main-menu').tasks.named('processResources')

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	// 1.21.11 is the last Minecraft version built against Java 21, which is also
	// the floor Java version set for all subprojects in the root build.gradle.

	// Loom will automatically attach a remapped sourcesJar to the "build" task if present.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
