plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
}

dependencies {
	api project(':api')
	implementation project(':features:hello-world-main-menu')
	implementation project(':features:steam-cloud-sync')
	implementation project(':features:friends-sidebar')
	implementation project(':features:rich-presence')
	implementation project(':features:steam-world-hosting')
	implementation project(':features:server-browser')
	implementation project(':services')

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Cardinal Components API: data attachment/sync/persistence for Fabric mods.
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"

	// Jar-in-Jar: physically bundles steamworks4j (JNI bridge + Valve's
	// redistributable binary alike) inside this module's shipped mod jar.
	include "com.code-disaster.steamworks4j:steamworks4j:${steamworks4j_version}"
}

// Writes a dev-only run/steam_appid.txt before runClient, defaulting to
// Valve's public test App ID 480 ("Spacewar"), overridable via
// -PsteamAppId=<id>. This is a Gradle-build-time concern, deliberately
// separate from SteamAppIdResolver's runtime JVM-system-property override
// (see services/steamworks/SteamAppIdResolver's JavaDoc).
tasks.register('generateSteamAppId') {
	def outputFile = layout.projectDirectory.file('run/steam_appid.txt')
	def appId = project.findProperty('steamAppId') ?: '480'
	inputs.property('appId', appId)
	outputs.file(outputFile)

	doLast {
		outputFile.asFile.parentFile.mkdirs()
		outputFile.asFile.text = "${appId}\n"
	}
}

tasks.named('runClient') {
	dependsOn tasks.named('generateSteamAppId')
}

// VS Code's Java launch configs invoke Loom's 'configureClientLaunch' as their
// preLaunchTask (they run the built classpath directly rather than going
// through 'runClient'), so steam_appid.txt must be generated here too or a
// fresh clone launched from VS Code silently skips Steam initialization.
// Loom registers 'configureClientLaunch' inside its own afterEvaluate block,
// so ours must run in afterEvaluate too (tasks.named(...) at config time
// fails since the task doesn't exist yet).
afterEvaluate {
	tasks.named('configureClientLaunch') {
		dependsOn tasks.named('generateSteamAppId')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	// Overrides the root project's Java 21 toolchain: this module needs a JDK 25
	// compiler regardless of JAVA_HOME/PATH. Gradle downloads it if not installed.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
